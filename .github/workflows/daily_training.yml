name: Daily AQI Model Training

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-data-refresh
  cancel-in-progress: false

jobs:
  train-models:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch latest 90-day AQI and weather data
        run: python src/fetch_data.py

      - name: Build model features
        run: python src/features.py

      - name: Train and evaluate AQI models
        run: python src/train.py

      - name: Generate feature importance explanations
        run: python src/explain.py

      - name: Generate latest AQI predictions
        run: python src/predict.py

      - name: Publish refreshed dashboard snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/raw/karachi_weather_air_quality_hourly.csv \
            data/processed/latest_predictions.csv \
            data/processed/model_metrics.csv \
            data/processed/feature_importance.csv \
            models/best_models.json \
            models/feature_columns.json
          if git diff --cached --quiet; then
            echo "Dashboard snapshot is already current."
          else
            git commit -m "Refresh trained AQI dashboard snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-aqi-training-artifacts
          path: |
            data/raw/*.csv
            data/processed/karachi_aqi_features.csv
            data/processed/model_metrics.csv
            data/processed/feature_importance.csv
            data/processed/latest_predictions.csv
            models/*.json
            models/*.joblib
          if-no-files-found: error
