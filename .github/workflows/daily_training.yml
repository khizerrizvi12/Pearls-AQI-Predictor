name: Daily AQI Model Training

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  train-models:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch latest 90-day AQI and weather data
        run: python src/fetch_data.py

      - name: Build model features
        run: python src/features.py

      - name: Train and evaluate AQI models
        run: python src/train.py

      - name: Generate feature importance explanations
        run: python src/explain.py

      - name: Generate latest AQI predictions
        run: python src/predict.py

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-aqi-training-artifacts
          path: |
            data/raw/*.csv
            data/processed/karachi_aqi_features.csv
            data/processed/model_metrics.csv
            data/processed/feature_importance.csv
            data/processed/latest_predictions.csv
            models/*.json
            models/*.joblib
          if-no-files-found: error
